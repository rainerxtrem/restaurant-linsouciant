name: Relances bons cadeaux

# Railway ne propose pas de cron pour un service web toujours démarré :
# GitHub Actions appelle la route de relance chaque matin. Logique dans
# src/app/api/cron/gift-voucher-reminders/route.ts (idempotent — un seul
# email par bon).

on:
  schedule:
    - cron: "0 8 * * *" # 8h UTC ≈ 9h-10h Paris
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la route de relance
        run: |
          base="${{ vars.SITE_URL || 'https://restaurant-linsouciant.fr' }}"
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "$base/api/cron/gift-voucher-reminders")
          echo "HTTP $status"
          cat response.json
          [ "$status" = "200" ] || { echo "::error::Relance échouée (HTTP $status)"; exit 1; }
