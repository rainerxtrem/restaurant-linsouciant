name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : aucune requête DB n'est faite au build / typecheck.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret=
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: L'Insouciant
      NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost:3000/media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
